<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkers Gate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-classic">
  <div class="theme-fx" id="theme-fx" aria-hidden="true"></div>

  <h1 id="title">Checkers vs Bot</h1>
  <p class="subtitle" id="subtitle">Beat the bot to enter the experience. You play white.</p>
  <a class="btn btn-donate btn-donate-top" id="btn-donate" href="https://www.donationalerts.com/r/dura12345" target="_blank" rel="noopener noreferrer">Donate</a>

  <div class="board-container">
    <div class="board" id="board"></div>

    <div class="side-panel">
      <div class="info-box">
        <h3 id="label-status">Status</h3>
        <div class="status" id="status">Your turn</div>
        <div class="turn-indicator">
          <div class="dot white" id="turn-dot"></div>
          <span id="turn-text">White (you)</span>
        </div>
      </div>

      <div class="info-box">
        <h3 id="label-diff">Difficulty</h3>
        <div class="difficulty" id="diff-text">Hard</div>
      </div>

      <div class="info-box">
        <h3 id="label-theme">Theme</h3>
        <div class="difficulty" id="theme-text">Classic</div>
      </div>

      <button class="btn btn-secondary" id="btn-new" style="width:100%">New game</button>
      <button class="btn btn-secondary" id="btn-close" style="width:100%">Close</button>

      <div class="info-box rules" id="rules">
        Mandatory captures. Kings fly. You may capture backwards.
      </div>
    </div>
  </div>

  <div id="win-overlay" class="win-message" style="display:none;">
    <div class="win-card">
      <h2 id="win-title">Victory!</h2>
      <p id="win-text">You beat the bot. You can now enter the experience.</p>
      <button class="btn btn-primary" id="btn-enter">Enter experience</button>
    </div>
  </div>

  <script src="checkers.js"></script>
</body>
</html>
